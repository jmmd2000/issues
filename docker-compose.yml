# Production compose: deployed to the VPS by Jenkins
name: ${APP_NAME}

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/${GITHUB_USER}/issues-api:${IMAGE_TAG}
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WEB_ORIGIN: https://${DOMAIN}
      UPLOADS_DIR: /app/data/uploads
      NODE_ENV: production
      PORT: 4000
      GLITCHTIP_DSN: ${GLITCHTIP_API_DSN:-}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT:-}
      GIT_SHA: ${IMAGE_TAG}
    volumes:
      - ./data/uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
      - web_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_proxy"
      - "traefik.http.routers.${APP_NAME}-api.rule=Host(`${DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))"
      - "traefik.http.routers.${APP_NAME}-api.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME}-api.tls.certresolver=myresolver"
      - "traefik.http.routers.${APP_NAME}-api.middlewares=${APP_NAME}-security-headers"

  web:
    image: ghcr.io/${GITHUB_USER}/issues-web:${IMAGE_TAG}
    restart: always
    environment:
      ORIGIN: https://${DOMAIN}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_GLITCHTIP_DSN: ${GLITCHTIP_WEB_DSN:-}
      PUBLIC_GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT:-}
      PUBLIC_GIT_SHA: ${IMAGE_TAG}
    depends_on:
      - api
    networks:
      - app_network
      - web_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web_proxy"
      - "traefik.http.routers.${APP_NAME}-web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${APP_NAME}-web.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME}-web.tls.certresolver=myresolver"
      - "traefik.http.routers.${APP_NAME}-web.middlewares=${APP_NAME}-security-headers"
      # The app's static files skip its own code, so the proxy sets the headers every response needs. The apps set the CSP.
      - "traefik.http.middlewares.${APP_NAME}-security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.${APP_NAME}-security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.${APP_NAME}-security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.${APP_NAME}-security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.${APP_NAME}-security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"

networks:
  app_network:
  web_proxy:
    external: true

volumes:
  pgdata:
    driver: local
