app: issues
images:
  - name: issues-api
    dockerfile: apps/api/Dockerfile
    buildArgs:
      GIT_SHA: "{tag}"
      BUILT_AT: "{builtAt}"
  - name: issues-web
    dockerfile: apps/web/Dockerfile
    buildArgs:
      PUBLIC_API_URL: "https://{domain}"
      GIT_SHA: "{tag}"
      BUILT_AT: "{builtAt}"
    buildSecrets:
      glitchtip_token: glitchtip-token
files: [docker-compose.yml, backup.sh]
database: db
healthcheck: /api/health
environments:
  production:
    dir: /home/james/issues/prod
    domain: issues.jamesmddoyle.com
    envCredential: issues-env-prod
    backup: true
